<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUM WAVE — My Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141B22; --slate:#1E2830; --paper:#F2EEE6; --dim:#9AA5AB;
  --brass:#C9A15C; --brass-soft:#8A6E3F; --teal:#5E8891;
  --red:#C96A5C; --yellow:#C9A15C; --green:#7FA98C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{
  background:var(--ink);color:var(--paper);
  font-family:-apple-system,'Pretendard','Noto Sans KR',system-ui,sans-serif;
  font-size:17px;line-height:1.6;
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
}
.serif{font-family:'Gowun Batang','Noto Serif KR',serif;}
/* ---------- 화면 전환 ---------- */
.screen{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 28px calc(32px + env(safe-area-inset-bottom));text-align:center;
  opacity:0;pointer-events:none;transition:opacity 1.1s ease;
}
.screen.on{opacity:1;pointer-events:auto;}
@media (prefers-reduced-motion: reduce){.screen{transition:none;}}
/* ---------- 스태거 리빌 — 글자들이 순서대로 떠오른다 ---------- */
.rv{
  opacity:0;transform:translate3d(0,10px,0);filter:blur(9px);
  -webkit-filter:blur(9px);
  will-change:opacity, transform, filter;
  backface-visibility:hidden;
}
.rv.rvin{
  opacity:1;transform:translate3d(0,0,0);filter:blur(0);-webkit-filter:blur(0);
  transition:opacity 1.5s ease,
             transform 1.5s cubic-bezier(.22,.61,.36,1),
             filter 1.5s cubic-bezier(.22,.61,.36,1),
             -webkit-filter 1.5s cubic-bezier(.22,.61,.36,1);
}
/* 동작 줄이기 — 흐림 리빌은 그대로, 위아래 움직임만 뺀다 */
@media (prefers-reduced-motion: reduce){
  .rv{opacity:0;transform:none;filter:blur(9px);-webkit-filter:blur(9px);}
  .rv.rvin{
    opacity:1;transform:none;filter:blur(0);-webkit-filter:blur(0);
    transition:opacity 1.5s ease, filter 1.5s cubic-bezier(.22,.61,.36,1), -webkit-filter 1.5s cubic-bezier(.22,.61,.36,1);
  }
}
/* Open Session — 테마를 고르면 서서히 태어난다 */
#openBtn{opacity:0;pointer-events:none;transform:translate3d(0,10px,0);filter:blur(9px);-webkit-filter:blur(9px);
  will-change:opacity, transform, filter;
  transition:opacity 1.4s ease, transform 1.4s cubic-bezier(.22,.61,.36,1),
             filter 1.4s cubic-bezier(.22,.61,.36,1), -webkit-filter 1.4s cubic-bezier(.22,.61,.36,1);}
#openBtn.show{opacity:1;pointer-events:auto;transform:translate3d(0,0,0);filter:blur(0);-webkit-filter:blur(0);}
@media (prefers-reduced-motion: reduce){
  #openBtn{transform:none;filter:blur(9px);-webkit-filter:blur(9px);
    transition:opacity 1.4s ease, filter 1.4s cubic-bezier(.22,.61,.36,1), -webkit-filter 1.4s cubic-bezier(.22,.61,.36,1);}
  #openBtn.show{transform:none;filter:blur(0);-webkit-filter:blur(0);}
}
/* 오브 입장 — 연했다가 짙어지며 떠오른다 */
#orbWrap{opacity:0;transform:scale(.9);will-change:opacity, transform;}
#orbWrap.in{opacity:1;transform:scale(1);transition:opacity 2.6s ease,transform 2.6s ease;}
@media (prefers-reduced-motion: reduce){
  #orbWrap{transform:none;}
  #orbWrap.in{transform:none;transition:opacity 2.2s ease;}
}
/* ---------- 공통 ---------- */
.eyebrow{font-size:11.5px;letter-spacing:.34em;color:var(--brass);text-transform:uppercase;margin-bottom:14px;}
h1{font-size:44px;font-weight:700;letter-spacing:.04em;line-height:1.25;}
.wordmark{font-family:'Cormorant Garamond',Georgia,serif;font-size:42px;font-weight:500;letter-spacing:.3em;margin-left:.3em;}
.lead{color:var(--dim);font-size:15.5px;margin-top:14px;max-width:300px;}
.btn{
  margin-top:38px;background:none;border:1.5px solid rgba(201,161,92,.75);color:var(--brass);
  border-radius:999px;padding:14px 44px;font-size:16px;letter-spacing:.14em;
  font-family:inherit;cursor:pointer;transition:background .3s,color .3s;
}
.btn:active{background:var(--brass);color:var(--ink);}
.btn:focus-visible{outline:2px solid var(--paper);outline-offset:3px;}
.btn.ghost{border-color:#3A4650;color:var(--dim);font-size:13.5px;padding:10px 26px;margin-top:16px;}
.q{font-size:24px;line-height:1.55;max-width:300px;}
/* ---------- 배경 오라 — 느리게 숨쉬는 빛 ---------- */
.aura{position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(90px);opacity:.5;}
.aura i{position:absolute;border-radius:50%;display:block;}
.aura .a1{width:70vmax;height:70vmax;left:-15vmax;top:-10vmax;background:radial-gradient(circle,rgba(201,161,92,.16),transparent 65%);animation:drift1 46s ease-in-out infinite alternate;}
.aura .a2{width:60vmax;height:60vmax;right:-20vmax;bottom:-15vmax;background:radial-gradient(circle,rgba(94,136,145,.14),transparent 65%);animation:drift2 58s ease-in-out infinite alternate;}
@keyframes drift1{from{transform:translate(0,0) scale(1);}to{transform:translate(9vmax,7vmax) scale(1.15);}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1);}to{transform:translate(-8vmax,-6vmax) scale(1);}}
@media (prefers-reduced-motion: reduce){.aura .a1,.aura .a2{animation:none;}}
/* ---------- 파문 로고 · 입장 ---------- */
.ripple-logo{width:170px;height:170px;margin-bottom:26px;}
#enterWrap{cursor:pointer;-webkit-tap-highlight-color:transparent;}
#enterWrap:focus-visible{outline:2px solid var(--paper);outline-offset:8px;border-radius:50%;}
#enterRing{transition:stroke-dashoffset .12s linear;}
.breathe-rings circle{transform-origin:100px 100px;animation:brg 7s ease-in-out infinite;}
.breathe-rings circle:nth-child(2){animation-delay:.6s;}
.breathe-rings circle:nth-child(3){animation-delay:1.2s;}
@keyframes brg{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.06);opacity:.7;}}
@media (prefers-reduced-motion: reduce){.breathe-rings circle{animation:none;}}
#enterHint{font-size:12.5px;letter-spacing:.22em;color:#5C6870;margin-top:30px;transition:color .4s;}
#enterHint.wake{color:var(--brass);}
/* ---------- 물결 선택 ---------- */
.waves{display:flex;flex-direction:row;gap:14px;margin-top:38px;justify-content:center;}
.wave{
  background:radial-gradient(circle at 50% 42%,rgba(30,40,48,.85),rgba(20,27,34,.3) 75%);
  border:1px solid rgba(126,139,149,.18);border-radius:26px;
  padding:14px 10px 12px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  width:104px;
  transition:border-color .4s, box-shadow .4s, transform .4s;
}
.wave svg{width:78px;height:78px;overflow:visible;}
.wave .rippond path{
  fill:none;stroke:#7E8B95;stroke-linecap:round;
  transition:stroke .4s;
}
.wave .rippond circle{fill:#7E8B95;transition:fill .4s;}
.wave span{font-size:14.5px;color:var(--paper);letter-spacing:.1em;font-family:'Gowun Batang',serif;}
.wave em{font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.08em;}
.wave.sel{border-color:rgba(201,161,92,.6);box-shadow:0 0 34px rgba(201,161,92,.14);transform:translateY(-3px);}
.wave.sel .rippond path{stroke:var(--brass);}
.wave.sel .rippond circle{fill:var(--brass);}
.wave.sel span{color:var(--brass);}
.wave:focus-visible{outline:2px solid var(--paper);outline-offset:2px;}
/* ---------- 테마·길이 ---------- */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;width:100%;max-width:340px;flex-shrink:0;}
.theme{
  background:linear-gradient(180deg,rgba(30,40,48,.75),rgba(30,40,48,.4));border:1.5px solid rgba(126,139,149,.14);border-radius:20px;
  padding:16px 20px;text-align:left;cursor:pointer;color:var(--paper);font-family:inherit;
  transition:border-color .25s;
}
.theme.sel{border-color:var(--brass);}
.theme:focus-visible{outline:2px solid var(--paper);outline-offset:2px;}
.theme{text-align:center;align-items:center;}
.theme .tn{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-weight:500;letter-spacing:.14em;}
.theme .tb{font-size:11.5px;letter-spacing:.4em;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums;margin-left:.4em;}
.lens{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap;justify-content:center;max-width:330px;}
#chooseScreen{justify-content:flex-start;overflow-y:auto;padding-top:calc(48px + env(safe-area-inset-top));}
#chooseScreen .btn{margin-top:28px;margin-bottom:20px;flex-shrink:0;}
.len{
  background:none;border:1.5px solid rgba(126,139,149,.3);color:var(--dim);border-radius:999px;
  padding:9px 22px;font-size:15px;cursor:pointer;font-family:inherit;transition:all .25s;
}
.len.sel{border-color:var(--brass);color:var(--brass);}
.len:focus-visible{outline:2px solid var(--paper);outline-offset:2px;}
/* ---------- 세션 ---------- */
#sessionScreen{justify-content:flex-start;padding-top:calc(26px + env(safe-area-inset-top));touch-action:none;}
#touchField{position:fixed;inset:0;z-index:0;}
#logline{font-size:11.5px;letter-spacing:.14em;color:var(--brass-soft);margin-top:12px;min-height:15px;}
#quad{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.55;transition:opacity 2s;filter:blur(.6px);}
#quad::before,#quad::after{content:"";position:absolute;background:linear-gradient(90deg,transparent,rgba(201,161,92,.1),transparent);}
#quad::before{left:10%;right:10%;top:50%;height:2px;border-radius:2px;}
#quad::after{top:12%;bottom:12%;left:50%;width:2px;border-radius:2px;background:linear-gradient(180deg,transparent,rgba(201,161,92,.1),transparent);}
#quad.dim{opacity:.22;}
.sess-ui{position:relative;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;width:100%;height:100%;}
#remain{font-size:13px;letter-spacing:.28em;color:var(--dim);font-variant-numeric:tabular-nums;}
#breathWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
#orbWrap{position:relative;width:150px;height:150px;}
#orb{
  --o1:#EED9AC; --o2:#D8B071; --o3:#C9A15C; --o4:#8A6E3F; --oglow:201,161,92;
  width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%, var(--o1), var(--o2) 40%, var(--o3) 62%, var(--o4) 88%);
  box-shadow:0 0 70px rgba(var(--oglow),.34), 0 0 140px rgba(var(--oglow),.14), inset -14px -18px 40px rgba(20,27,34,.35);
  transition:transform .2s linear, box-shadow .5s;
}
#orbWrap::before,#orbWrap::after{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  border:1px solid rgba(var(--haloc,201,161,92),.28);
  animation:halo 9s ease-out infinite;
}
#orbWrap::after{animation-delay:4.5s;}
@keyframes halo{0%{transform:scale(1);opacity:.5;}100%{transform:scale(2.4);opacity:0;}}
@media (prefers-reduced-motion: reduce){#orbWrap::before,#orbWrap::after{animation:none;opacity:0;}}
#mwave{
  width:250px;height:26px;margin-top:11px;display:block;opacity:0;
  transition:opacity 1.4s ease;
}
#mwave.live{opacity:.9;}
/* 컨트롤 스트립 — 하단 제어 구역. 음악이 꺼져 있으면 Music 한 단어만 존재한다 */
#mstrip{
  pointer-events:none;display:flex;align-items:center;gap:15px;
  margin-bottom:8px;padding:0 4px;
}
.mt{
  pointer-events:none;background:none;border:none;font-family:'Cormorant Garamond',Georgia,serif;
  font-size:14px;letter-spacing:.26em;color:rgba(154,165,171,.34);
  cursor:pointer;padding:10px 2px;position:relative;
  transition:color .6s ease, text-shadow .6s ease;
}
.mt::after{
  content:"";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:3px;height:3px;border-radius:50%;background:currentColor;
  opacity:0;transition:opacity .6s ease;
}
#sessionScreen.on .mt{pointer-events:auto;}
.mt.on{color:var(--brass);text-shadow:0 0 16px rgba(201,161,92,.5);}
.mt.on::after{opacity:.85;}
.mt.sm{font-size:11.5px;letter-spacing:.22em;}
.mt.nx{color:rgba(201,161,92,.5);}
.mt.nx::after{display:none;}
.mt.nx:active{color:var(--brass);}
.mt.nx.turning{opacity:.35;}
#mstems{
  display:flex;align-items:center;gap:13px;
  opacity:0;filter:blur(7px);-webkit-filter:blur(7px);transform:translate3d(-6px,0,0);
  pointer-events:none;
  transition:opacity 1s ease, filter 1s cubic-bezier(.22,.61,.36,1),
             -webkit-filter 1s cubic-bezier(.22,.61,.36,1), transform 1s cubic-bezier(.22,.61,.36,1);
}
#mstems.show{opacity:1;filter:blur(0);-webkit-filter:blur(0);transform:none;}
#sessionScreen.on #mstems.show{pointer-events:auto;}
#mstems:not(.show) .mt{pointer-events:none!important;}
.msep{width:1px;height:13px;background:linear-gradient(180deg,transparent,rgba(201,161,92,.3),transparent);}
#endBtn{
  background:none;border:none;color:var(--dim);
  opacity:.3;font-size:12.5px;letter-spacing:.3em;font-family:inherit;cursor:pointer;
  padding:12px 20px;margin-bottom:6px;transition:opacity .4s;
}
#endBtn:active{opacity:.7;}
#sessionScreen.on #endBtn{pointer-events:auto;}
#breathRings{position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);overflow:visible;pointer-events:none;}
#breathRings .br{fill:none;stroke:var(--brass);stroke-width:1;}
/* ---------- 체크아웃 ---------- */
#delta{font-size:19px;line-height:1.75;max-width:310px;}
.closing{font-size:15px;color:var(--brass);margin-top:26px;letter-spacing:.03em;line-height:1.8;}
</style>
</head>
<body>
<div class="aura"><i class="a1"></i><i class="a2"></i></div>

<!-- 1. 웰컴 -->
<div class="screen on" id="welcomeScreen">
  <div id="enterWrap" role="button" tabindex="0" aria-label="Press and hold to enter">
    <svg class="ripple-logo" viewBox="0 0 200 200">
      <defs>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.2"/>
        </filter>
        <radialGradient id="coreGrad">
          <stop offset="0%" stop-color="#EED9AC"/><stop offset="100%" stop-color="#C9A15C"/>
        </radialGradient>
      </defs>
      <g fill="none" stroke="#C9A15C" class="breathe-rings" filter="url(#soft)" opacity=".6">
        <circle cx="100" cy="100" r="16" stroke-width="2.4"/>
        <circle cx="100" cy="100" r="38" stroke-width="2" opacity=".75"/>
        <circle cx="100" cy="100" r="62" stroke-width="1.6" opacity=".5"/>
      </g>
      <circle id="enterRingGlow" cx="100" cy="100" r="94" fill="none" stroke="#C9A15C" stroke-width="4" opacity=".4"
        stroke-linecap="round" stroke-dasharray="590.6" stroke-dashoffset="590.6" transform="rotate(-90 100 100)" filter="url(#soft)"/>
      <circle id="enterRing" cx="100" cy="100" r="94" fill="none" stroke="#E3C68C" stroke-width="1.4"
        stroke-linecap="round" stroke-dasharray="590.6" stroke-dashoffset="590.6" transform="rotate(-90 100 100)"/>
      <g fill="none" stroke="#C9A15C" class="breathe-rings">
        <circle cx="100" cy="100" r="16" stroke-width="1.3"/>
        <circle cx="100" cy="100" r="38" stroke-width="1" opacity=".75"/>
        <circle cx="100" cy="100" r="62" stroke-width=".8" opacity=".5"/>
      </g>
      <circle cx="100" cy="100" r="5" fill="url(#coreGrad)"/>
    </svg>
  </div>
  <div class="eyebrow rv">Sound Oasis · Sound Meditation</div>
  <h1 class="wordmark rv">SUM WAVE</h1>
  <p id="enterHint" class="rv">Press it slowly..</p>
</div>

<!-- 2. 체크인 — 마음의 수면 -->
<div class="screen" id="checkinScreen">
  <div class="eyebrow rv">Check in</div>
  <p class="q serif rv">Present day.<br>How is your sensibility</p>
  <div class="waves" id="wavesIn">
    <button class="wave rv" data-w="rough">
      <svg viewBox="0 0 100 100"><g class="rippond"></g></svg>
      <span>Waves</span><em>restless</em>
    </button>
    <button class="wave rv" data-w="ripple">
      <svg viewBox="0 0 100 100"><g class="rippond"></g></svg>
      <span>Ripples</span><em>settling</em>
    </button>
    <button class="wave rv" data-w="still">
      <svg viewBox="0 0 100 100"><g class="rippond"></g></svg>
      <span>Still</span><em>calm</em>
    </button>
  </div>
</div>

<!-- 3. 테마·길이 -->
<div class="screen" id="chooseScreen">
  <div class="eyebrow rv">Choose your current</div>
  <div class="themes" id="themes">
    <button class="theme rv" data-t="calm"><div class="tn">Calm</div><div class="tb">4 · 6</div></button>
    <button class="theme rv" data-t="pause"><div class="tn">Pause</div><div class="tb">4 · 8</div></button>
    <button class="theme rv" data-t="flow"><div class="tn">Align</div><div class="tb">5 · 5</div></button>
    <button class="theme rv" data-t="sleep"><div class="tn">Sleep</div><div class="tb">4 · 8</div></button>
    <button class="theme rv" data-t="focus"><div class="tn">Focus</div><div class="tb">4 · 4</div></button>
    <button class="theme rv" data-t="restore"><div class="tn">Restore</div><div class="tb">2 · 4</div></button>
  </div>
  <div class="lens rv" id="pro" style="margin-top:20px;">
    <button class="len" data-p="tuning">A=432</button>
    <button class="len" data-p="binaural">🎧 Depth</button>
    <button class="len" data-p="moktak">Moktak</button>
  </div>
  <p class="lead rv" id="proHint" style="margin-top:10px;font-size:12.5px;min-height:16px;"></p>
  <div class="lens rv" id="lens">
    <button class="len" data-m="5">5 min</button>
    <button class="len sel" data-m="10">10 min</button>
    <button class="len" data-m="15">15 min</button>
    <button class="len" data-m="20">20 min</button>
    <button class="len" data-m="30">30 min</button>
    <button class="len" data-m="45">45 min</button>
    <button class="len" data-m="60">60 min</button>
  </div>
  <button class="btn" id="openBtn">Open Session</button>
</div>

<!-- 4. 세션 -->
<div class="screen" id="sessionScreen">
  <canvas id="touchField"></canvas>
  <div id="quad" aria-hidden="true"></div>
  <div class="sess-ui">
    <div id="remain" class="rv">10:00</div>
    <canvas id="mwave" class="rv" width="750" height="78" aria-hidden="true"></canvas>
    <div id="breathWrap">
      <div id="orbWrap">
        <svg id="breathRings" viewBox="0 0 300 300" aria-hidden="true">
          <circle class="br" cx="150" cy="150" r="110"/>
          <circle class="br" cx="150" cy="150" r="110"/>
          <circle class="br" cx="150" cy="150" r="110"/>
        </svg>
        <div id="orb"></div>
      </div>
    </div>
    <div id="mstrip" class="rv">
      <button class="mt" id="mMaster" data-m="master">Music</button>
      <div id="mstems">
        <span class="msep"></span>
        <button class="mt sm on" data-m="beat">Beat</button>
        <button class="mt sm on" data-m="bass">Bass</button>
        <button class="mt sm on" data-m="mel">Melody</button>
        <span class="msep"></span>
        <button class="mt sm nx" id="mNext">Next</button>
      </div>
    </div>
    <button id="endBtn" class="rv">Finish</button>
  </div>
</div>

<!-- 5. 체크아웃 -->
<div class="screen" id="checkoutScreen">
  <div class="eyebrow rv">Check out</div>
  <p class="q serif rv">And now.<br>How is your sensibility</p>
  <div class="waves" id="wavesOut">
    <button class="wave rv" data-w="rough"><svg viewBox="0 0 100 100"><g class="rippond"></g></svg><span>Waves</span></button>
    <button class="wave rv" data-w="ripple"><svg viewBox="0 0 100 100"><g class="rippond"></g></svg><span>Ripples</span></button>
    <button class="wave rv" data-w="still"><svg viewBox="0 0 100 100"><g class="rippond"></g></svg><span>Still</span></button>
  </div>
  <p id="delta" class="rv"></p>
  <p id="logline" class="rv"></p>
  <p class="closing serif rv" id="closingLine">Where this resonance ends,<br>your day begins.</p>
  <button class="btn rv" id="againBtn">Start over</button>
</div>

<script>
'use strict';
/* ================= 상태 ================= */
const S={
  screen:'welcome', colorIn:null, colorOut:null,
  theme:'calm', mins:10,
  tuning:440, binaural:false, moktak:false,
  running:false, tEnd:0, tStart:0, miniPhase:-1, closing:false, rang:false
};
/* 바이노럴 — 테마별 뇌파 대역 (Meditation Builder 사양: 델타 0.5~4 / 세타 4~8 / 알파 8~14Hz · 헤드폰 전제) */

  {frac:0.18, ko:'울리기', drone:1.0},
  {frac:0.72, ko:'받기',   drone:1.25}

const THEMES={

  calm:   {breath:[['in',4],['out',6]], root:0, pulse:0},
  pause:  {breath:[['in',4],['out',8]], root:0, pulse:0},
  flow:   {breath:[['in',5],['out',5]], root:2, pulse:55},
  sleep:  {breath:[['in',4],['out',8]], root:9, pulse:0},
  focus:  {breath:[['in',4],['out',4]], root:7, pulse:0},
  restore:{breath:[['in',2],['out',4]], root:2, pulse:0}

/* 4악기가 한 조성 안에서 울린다 — 사분면별 악기·음역 */

const QUADS={

const PENTA=[0,3,5,7,10];
const $=id=>document.getElementById(id);

/* ================= 오디오 엔진 (미니) ================= */
let AC=null, master=null, reverb=null, wet=null, dry=null, pulseG=null, limiter=null;
const f2m=m=>S.tuning*Math.pow(2,(m-69)/12);
function ctx(){
  if(AC)return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.7;
  const lim=AC.createDynamicsCompressor();limiter=lim;
  lim.threshold.value=-10;lim.ratio.value=12;lim.attack.value=0.003;lim.release.value=0.25;
  /* 리버브 — 4.5초 감쇠 임펄스 */

  const len=AC.sampleRate*7, ib=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
  reverb.buffer=ib;
  wet=AC.createGain();wet.gain.value=0.5;
  dry=AC.createGain();dry.gain.value=0.9;
  pulseG=AC.createGain();pulseG.gain.value=1;
  master.connect(pulseG);
  pulseG.connect(dry);pulseG.connect(reverb);reverb.connect(wet);
  dry.connect(lim);wet.connect(lim);lim.connect(AC.destination);
  return AC;
}
/* 스케일 잠금 — 최근접 펜타토닉 */
function lock(midi,root){
  const pcs=PENTA.map(i=>(root+i)%12);
  const pc=((midi%12)+12)%12;
  let best=pcs[0],bd=99;
  pcs.forEach(p=>{let d=Math.abs(p-pc);d=Math.min(d,12-d);if(d<bd){bd=d;best=p;}});
  let out=midi-pc+best;
  if(best-pc>6)out-=12;if(pc-best>6)out+=12;
  return out;
}
/* 드론 — 스테레오 듀얼 패스 + 다층 슬로우 모듈레이션 (익스프레션 스웰 · 필터 일렁임 · 피치 셰이딩 · 숨쉬는 에어) */
let droneNodes=[],droneTimers=[],driftVoices=[],driftState={iv:7,tonic:48},breathG=null,binG=null,glintCfg=null;

const DRIFT_SET=[7,5,10];
function droneDrift(){
  if(!driftVoices.length)return;
  const ac=ctx(),t=ac.currentTime;
  const options=DRIFT_SET.filter(v=>v!==driftState.iv);
  const next=options[(Math.random()*options.length)|0];
  driftState.iv=next;
  driftVoices.forEach(v=>{
    /* 6~8초에 걸친 미끄러짐 — 전환이 아니라 기울어짐 */
    v.osc.frequency.setTargetAtTime(f2m(driftState.tonic+next+v.plus),t,2.2+Math.random()*0.6);
  });
}
function slowLFO(ac,t,hz,depth,target,wave){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=wave||'sine';o.frequency.value=hz;g.gain.value=depth;
  o.connect(g);g.connect(target);o.start(t);
  droneNodes.push(o);
  return o;
}

  const mkSide=(pan,lfHz,lfHz2)=>{
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=560;lp.Q.value=0.7;
    slowLFO(ac,t,lfHz,150,lp.frequency);
    slowLFO(ac,t,lfHz2,90,lp.frequency);

    slowLFO(ac,t,1/38,0.09,pg.gain);

    lp.connect(pg);

  const nbuf=ac.createBuffer(2,ac.sampleRate*4,ac.sampleRate);
  for(let c=0;c<2;c++){
    const d=nbuf.getChannelData(c);

    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last*0.96+w*0.04);d[i]=last*3.2;}

  slowLFO(ac,t,1/67,320,nbp.frequency);
  const ng=ac.createGain();ng.gain.value=0.018;
  slowLFO(ac,t,1/43,0.012,ng.gain);
  nb.connect(nbp);nbp.connect(ng);ng.connect(amp);nb.start(t);
  droneNodes.push(nb);
  /* ---------- 상층 패드 — 넓게 번지는 화음 (엔델 계열의 층) ---------- */
  [[12,-4,0.06,0.019,-0.45],[15,5,0.045,0.013,0.4],[19,-2,0.035,0.011,0.15]].forEach(([iv,dt,base,dep,pan],k)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=k===1?'triangle':'sine';
    o.frequency.value=f2m(tonic+iv);o.detune.value=dt;

    g.gain.value=base;
    slowLFO(ac,t,1/(50+k*17),dep,g.gain);
    const pn=ac.createStereoPanner?ac.createStereoPanner():null;
    o.connect(g);
    if(pn){pn.pan.value=pan;slowLFO(ac,t,1/(61+k*13),0.2,pn.pan);g.connect(pn);pn.connect(amp);}
    else g.connect(amp);

    if(k===1)driftVoices.push({osc:o,plus:8});
  });

  glintCfg={tonic,root};

    if(!breathG)return;
    const ac2=ctx(),tt=ac2.currentTime+0.02;
    const offs=[0,3,5,7,10,12,15,19];

    m=lock(m,root);
    while(m>96)m-=12;while(m<72)m+=12;

      const o=ac2.createOscillator(),g=ac2.createGain();

      g.gain.setValueAtTime(0.0001,tt);

     리버브와 글루 리미터를 우회한다. 컨볼루션 잔향과 스테레오 링크 압축은 좌우 위상차를 뭉갠다. */

  }

  if(pulseBpm){
    const pl=ac.createOscillator(),pd=ac.createGain();
    pl.type='sine';pl.frequency.value=pulseBpm/60;pd.gain.value=0.05;
    pulseG.gain.value=0.95;
    pl.connect(pd);pd.connect(pulseG.gain);pl.start(t);
    droneNodes.push(pl);
  }

}
let droneAmp=null;
function stopDrone(fade){
  droneTimers.forEach(iv=>clearTimeout(iv));droneTimers=[];driftVoices=[];breathG=null;
  const ac=ctx(),t=ac.currentTime;
  if(droneAmp){
    droneAmp.gain.cancelScheduledValues(t);
    droneAmp.gain.setValueAtTime(Math.max(droneAmp.gain.value,0.0001),t);
    droneAmp.gain.exponentialRampToValueAtTime(0.0001,t+fade);
    droneAmp=null;
  }
  if(binG){
    binG.gain.cancelScheduledValues(t);
    binG.gain.setValueAtTime(Math.max(binG.gain.value,0.0001),t);
    binG.gain.exponentialRampToValueAtTime(0.0001,t+fade);
    binG=null;
  }
  const nodes=droneNodes;droneNodes=[];
  setTimeout(()=>{nodes.forEach(n=>{
    try{if(n.stop)n.stop();}catch(e){}
    try{n.disconnect();}catch(e){}
  });},fade*1000+300);
}
function noteOut(v,dist,wetMul){
  /* 원근 — 멀수록 잔향 깊게, 어둡게, 작게. wetMul 은 마른 악기용 잔향 감량 */
  const ac=ctx(),d=dist==null?0.3:dist;
  /* 하우스 레이어가 울리는 동안엔 명상 악기가 묻히지 않도록 앞으로 당긴다 */
  const out=ac.createGain();out.gain.value=v*(1-0.35*d)*(M.on?1.35:1);
  const lp=ac.createBiquadFilter();lp.type='lowpass';
  lp.frequency.value=6500-4200*d;lp.Q.value=0.3;
  out.connect(lp);
  const dg=ac.createGain();dg.gain.value=1-0.5*d;
  const wg=ac.createGain();wg.gain.value=(0.35+0.6*d)*(wetMul==null?1:wetMul);
  lp.connect(dg);dg.connect(dry);
  lp.connect(wg);wg.connect(reverb);
  return out;
}
/* 싱잉볼 — 말렛 어택 + 비팅 배음 */
function bowl(t,midi,v,dist){
  const ac=ctx(),f=f2m(midi),dec=6+v*3;
  const out=noteOut(v*1.0,dist);
  /* 말렛 타격 트랜지언트 — 짧은 고역 틱이 어택을 또렷하게 */
  const tk=ac.createOscillator(),tg=ac.createGain();
  tk.type='triangle';tk.frequency.value=f*4.2;
  tg.gain.setValueAtTime(0.0001,t);
  tg.gain.exponentialRampToValueAtTime(0.16*v,t+0.004);
  tg.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  tk.connect(tg);tg.connect(out);tk.start(t);tk.stop(t+0.15);
  [[1,0.52],[1.005,0.46],[2.32,0.2],[3.42,0.09],[4.6,0.04]].forEach(([r,a])=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.value=f*r;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(a*0.42,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec*(r>2?0.45:1));
    o.connect(g);g.connect(out);o.start(t);o.stop(t+dec+0.2);
  });
}
/* 핸드팬 — 옥타브·12도 배음, 짧은 감쇠 */
function handpan(t,midi,v,dist){
  const ac=ctx(),f=f2m(midi),dec=3.2+v*2;
  const out=noteOut(v*0.75,dist);
  [[1,0.5],[2,0.28],[3,0.14],[4.2,0.05]].forEach(([r,a])=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.value=f*r;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(a*0.34,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec/r);
    o.connect(g);g.connect(out);o.start(t);o.stop(t+dec+0.2);
  });
}
/* ---------- 지속 제스처 엔진 ----------
   탭(<220ms) = 스트라이크 / 홀드 = 울림이 차오름 / 문지르기 = 리밍(속도에 반응, 음 글라이드) */

  const h={oscs:[],noiseG:null,rollIv:null,dead:false,base:0.09+c.vel*0.15,cur:c.midi};
  const cont = c.inst==='bowl'||c.inst==='cello';
  if(cont){
    const parts=c.inst==='bowl'
      ?[[1,'sine',0.5],[1.005,'sine',0.46],[2.32,'sine',0.14],[3.42,'sine',0.05]]
      :[[1,'sawtooth',0.3],[1.003,'sawtooth',0.28],[2,'triangle',0.2],[3,'sine',0.06]];
    const lp=ac.createBiquadFilter();lp.type='lowpass';
    lp.frequency.value=c.inst==='bowl'?2600:1200;lp.Q.value=0.5;
    lp.connect(master1);
    parts.forEach(([r,w,lv])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=w;o.frequency.value=f2m(c.midi)*r;
      g.gain.value=lv;o.connect(g);g.connect(lp);o.start();
      h.oscs.push({o,r});
    });
    /* 리밍 숨결 — 가죽이 놋쇠를 스치는 소리 */
    if(c.inst==='bowl'){
      const nb=ac.createBufferSource();
      const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      nb.buffer=buf;nb.loop=true;
      const bp=ac.createBiquadFilter();bp.type='bandpass';
      bp.frequency.value=f2m(c.midi)*2;bp.Q.value=6;
      h.noiseG=ac.createGain();h.noiseG.gain.value=0;
      nb.connect(bp);bp.connect(h.noiseG);h.noiseG.connect(master1);

    const ROLLV={handpan:handpan,moktak:moktak,tingsha:tingsha};
    const ROLLMS={handpan:150,moktak:135,tingsha:110};
    h.rollIv=setTimeout(function tick(){
      if(h.dead)return;
      (ROLLV[c.inst]||tingsha)(ac.currentTime+0.003,h.cur,0.16+Math.random()*0.08,c.dist);
      h.rollIv=setTimeout(tick,ROLLMS[c.inst]||130);

    if(h.dead||!cont)return;

    if(h.dead||!cont||midi===h.cur)return;
    h.cur=midi;
    const t=ctx().currentTime;
    h.oscs.forEach(p=>{if(p.r)p.o.frequency.setTargetAtTime(f2m(midi)*p.r,t,0.09);});
  };
  h.release=()=>{
    if(h.dead)return;h.dead=true;
    if(h.rollIv)clearTimeout(h.rollIv);
    const t=ac.currentTime;
    master1.gain.cancelScheduledValues(t);
    master1.gain.setValueAtTime(Math.max(master1.gain.value,0.0001),t);

  [[0,-6,'sawtooth',0.32],[0,0,'sawtooth',0.28],[0,6,'sawtooth',0.3],[12,-2,'triangle',0.18],[19,0,'sine',0.05]].forEach(([iv,dt,w,lv])=>{

   (1) 채가 닿는 순간의 광대역 딱 소리, 1.5ms 상승 32ms 소멸
   (2) 통의 판 진동. 배음이 아니라 어긋난 비율(1 / 1.58 / 2.36 / 3.41)이 나무를 만든다.
       타격 직후 4.5% 피치 하강이 특유의 "톡"을 낸다
   (3) 통 안 공기의 짧은 두께. 기음 아래 옥타브 부근을 좁게 때린다

  const vv=Math.max(0.2,Math.min(1,v||0.5));

  const n=ac.createBufferSource();n.buffer=noiseBuf();
  const bp=ac.createBiquadFilter();bp.type='bandpass';
  bp.frequency.value=2600+Math.random()*900;bp.Q.value=0.6;

  ng.gain.setValueAtTime(0.0001,t);
  ng.gain.exponentialRampToValueAtTime(0.22*vv,t+0.0015);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.032);
  n.connect(bp);bp.connect(ng);ng.connect(fm);n.start(t);n.stop(t+0.05);
  /* (2) 판 모드 */
  [[1,0.55,0.24],[1.58,0.19,0.12],[2.36,0.10,0.075],[3.41,0.05,0.045]].forEach(([r,a,dec],k)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=k?'sine':'triangle';
    o.frequency.setValueAtTime(f*r*1.045,t);
    o.frequency.exponentialRampToValueAtTime(f*r,t+0.045);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(a*0.5*vv,t+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
    o.connect(g);g.connect(fm);o.start(t);o.stop(t+dec+0.05);
  });
  /* (3) 통 안의 공기 */
  const cb=ac.createBufferSource();cb.buffer=noiseBuf();
  const cl=ac.createBiquadFilter();cl.type='bandpass';
  cl.frequency.value=f*0.5;cl.Q.value=1.8;
  const cg=ac.createGain();
  cg.gain.setValueAtTime(0.0001,t);
  cg.gain.exponentialRampToValueAtTime(0.10*vv,t+0.004);
  cg.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
  cb.connect(cl);cl.connect(cg);cg.connect(fm);cb.start(t);cb.stop(t+0.15);
}

const MOK={on:false,next:0,i:0,n:0,iv:0,timer:null};
function moktakStart(delay){
  const ac=ctx(),pat=THEMES[S.theme].breath;
  const cyc=pat.reduce((a,q)=>a+q[1],0);
  MOK.n=Math.max(4,Math.round(cyc/1.15));
  MOK.iv=cyc/MOK.n;MOK.i=0;
  MOK.next=ac.currentTime+(delay||0);
  MOK.on=true;
  clearInterval(MOK.timer);
  MOK.timer=setInterval(moktakPump,50);
}
function moktakPump(){
  if(!MOK.on||!S.running)return;
  const ac=ctx();
  if(ac.currentTime-MOK.next>1){
    const skip=Math.ceil((ac.currentTime-MOK.next)/MOK.iv);
    MOK.next+=skip*MOK.iv;MOK.i+=skip;
  }
  while(MOK.next<ac.currentTime+0.6){
    if(MOK.next>ac.currentTime-0.05){
      const root=THEMES[S.theme].root;
      const accent=(MOK.i%MOK.n===0);
      const m=lock(72+root,root)+(accent?-2:0);
      moktak(MOK.next,m,accent?0.8:0.42,0.32);
    }
    MOK.i++;MOK.next+=MOK.iv;
  }
}

  const sc=MODE_IV[modeName];

  if(s[0]==='b'){flat=true;s=s.slice(1);}
  const m=s.match(/^(iv|iii|ii|i|vii|vi|v|IV|III|II|I|VII|VI|V)/);

  let root=ROMAN[m[1].toLowerCase()];

  const idx=sc.indexOf(root%12);
  let tones;
  if(idx>=0){
    const at=n=>sc[(idx+n)%7]+(idx+n>=7?12:0);
    tones=[0,at(2)-sc[idx],at(4)-sc[idx]];
    if(/9/.test(rest))tones.push(at(6)-sc[idx],at(8)-sc[idx]+((idx+8>=14)?12:0));

/* ---------- 편곡 — 섹션별 레이어 (원본 폼 해석) ---------- */
const SECT={
  Intro: {kick:1,clap:0,hat:1,ohat:0,perc:0,bass:0,pad:1,lead:0},
  Verse: {kick:1,clap:1,hat:1,ohat:0,perc:1,bass:1,pad:1,lead:0.5},
  Build: {kick:1,clap:1,hat:1,ohat:1,perc:1,bass:1,pad:1,lead:0.8},
  Drop:  {kick:1,clap:1,hat:1,ohat:1,perc:1,bass:1,pad:1,lead:1},
  Break: {kick:0,clap:0,hat:0,ohat:0,perc:0,bass:0,pad:1,lead:0.7},
  Outro: {kick:1,clap:0,hat:1,ohat:0,perc:0,bass:0,pad:1,lead:0}

function sectionAt(bar){
  let acc=0;
  for(const [name,len] of M.form){ if(bar<acc+len)return {name,len,into:bar-acc}; acc+=len; }
  return {name:'Drop',len:16,into:0};
}
function musicBars(){return M.form.reduce((a,f)=>a+f[1],0);}
function scheduleStep(step,t){
  const spb=60/M.bpm, s16=spb/4;

  const si=sectionAt(bar);
  const sec=SECT[si.name]||SECT.Drop;
  const prog=(si.name==='Break'&&M.progB)?M.progB:M.prog;
  const tones=chordTones(prog[bar%prog.length],M.mode);
  const rootPc=M.tonic+tones[0];
  /* 드럼 */
  if(sec.kick&&HOUSE_GRID.kick.includes(st)){
    hKick(t);
    if(M.beat)wbump(t,Math.round(WCEN),1,7);
    /* 사이드체인 — 원본 뎁스(멜로딕 0.5 / 딥 0.2), 리드는 0.7배 */
    const dg=M.g.duckG.gain;

  if(sec.hat&&HOUSE_GRID.hat.includes(st)){hHat(t,false);if(M.beat)wbump(t,Math.round(WCEN)+5,0.3,3);}
  if(sec.ohat&&HOUSE_GRID.ohat.includes(st)){hHat(t,true);if(M.beat)wbump(t,Math.round(WCEN)+6,0.4,3);}
  if(sec.perc&&HOUSE_GRID.perc.includes(st)){hPerc(t);if(M.beat)wbump(t,Math.round(WCEN)-4,0.26,3);}

  if(sec.lead){
    if(M.gid==='melodichouse'){
      const mo=M.motif;
      const pos=mo.steps.indexOf(st);
      /* 절제 구간(Verse)에선 모티프의 앞 절반만 — 드롭에서 온전히 드러난다 */

      if(pos>=0&&!thin){
        const deg=mo.seq[pos%mo.seq.length];

        let m=60+M.tonic+iv;
        if(sec.lead>=1)m+=12;

    } else if([2,10].includes(st)&&Math.random()<sec.lead+0.2){
      const ms=tones.slice(0,4).map(iv=>{let m=55+M.tonic+iv;while(m>74)m-=12;return m;});
      hRhodes(t,ms,0.8);
      if(M.mel)ms.forEach(m=>wbump(t,barForMidi(m),0.5,3));
    }
  }
  /* 패드 — 마디 머리 */
  if(sec.pad&&st===0){
    const ms=tones.slice(0,3).map(iv=>{let m=60+M.tonic+iv;while(m>76)m-=12;return m;});
    hPad(t,ms,spb*4*0.98);

function musicPump(){

  if(!M.bars||M.bars.length!==WBARS)M.bars=new Float32Array(WBARS);
  const now=ctx().currentTime;

  while(q.length&&q[0].at<=now+0.005){
    const e=q.shift();
    const w=Math.max(1,e.width), s=w/2;
    for(let b=Math.max(0,e.bar-w);b<=Math.min(WBARS-1,e.bar+w);b++){

    g.strokeStyle='rgba(201,161,92,0.14)';g.lineWidth=bw*2.1;g.stroke();

/* 부유 입자 — 놋쇠 티끌이 아주 느리게 떠오른다 */
let dust=[];
function initDust(){
  dust=[];
  const n=innerWidth<500?34:52;
  for(let i=0;i<n;i++)dust.push({
    x:Math.random(),y:Math.random(),
    r:(0.6+Math.random()*1.6)*devicePixelRatio,
    s:0.006+Math.random()*0.014,

initDust();

function drawRipples(){
  cx2.clearRect(0,0,cv.width,cv.height);

    dust.forEach(p=>{
      p.y-=p.s/600;if(p.y<-0.02){p.y=1.02;p.x=Math.random();}
      const tw=0.7+0.3*Math.sin(now/1600+p.ph);

      cx2.fillStyle=`rgba(216,195,154,${(p.a*tw).toFixed(3)})`;
      cx2.fill();
    });

  const LIFE=7200;
  ripples=ripples.filter(r=>now-r.t0<LIFE);
  ripples.forEach(r=>{
    if(r.wob==null)r.wob=Math.random()*Math.PI*2;
    const age=(now-r.t0)/LIFE;

    const born=Math.min(1,age/0.09);

/* 터치 해석 — 사분면=악기, 사분면 내 세로=음높이, 압력=세기, 중앙거리=원근 */

  ripples.push({x:x*devicePixelRatio,y:y*devicePixelRatio,t0:performance.now(),v:vel,d:dist});
  startRipples();
  /* 오브가 터치에 은은히 반응 */
  const orb=$('orb');
  const og=getComputedStyle(orb).getPropertyValue('--oglow').trim()||'201,161,92';
  orb.style.boxShadow=`0 0 ${80+vel*70}px rgba(${og},${0.34+vel*0.2}), 0 0 150px rgba(${og},.16), inset -14px -18px 40px rgba(20,27,34,.35)`;
  setTimeout(()=>{orb.style.boxShadow='';},600);
}
const touches=new Map();
$('sessionScreen').addEventListener('pointerdown',e=>{
  if(e.target.closest('#endBtn')||!S.running)return;
  const c=calcTouch(e.clientX,e.clientY,e.pressure);
  touches.set(e.pointerId,{
    t0:performance.now(), x:e.clientX, y:e.clientY,
    lx:e.clientX, ly:e.clientY, lt:performance.now(),
    moved:false, c, sus:startSustain(c), lastRip:0
  });
  try{e.target.setPointerCapture&&$('sessionScreen').setPointerCapture(e.pointerId);}catch(err){}
});
$('sessionScreen').addEventListener('pointermove',e=>{
  const h=touches.get(e.pointerId);if(!h)return;
  const now=performance.now();
  const dx=e.clientX-h.lx, dy=e.clientY-h.ly;
  const dt=Math.max(8,now-h.lt);
  const speed=Math.min(1,Math.hypot(dx,dy)/dt/1.4);
  if(Math.hypot(e.clientX-h.x,e.clientY-h.y)>18)h.moved=true;
  if(h.moved){
    h.sus.rub(speed,e.pressure);
    const nc=calcTouch(e.clientX,e.clientY,e.pressure);
    if(nc.inst===h.c.inst)h.sus.glide(nc.midi);
    if(now-h.lastRip>260){
      h.lastRip=now;
      ripples.push({x:e.clientX*devicePixelRatio,y:e.clientY*devicePixelRatio,t0:now,v:0.14+speed*0.2,d:nc.dist});
      startRipples();
    }
  }
  h.lx=e.clientX;h.ly=e.clientY;h.lt=now;
});
function endTouch(e){
  const h=touches.get(e.pointerId);if(!h)return;
  touches.delete(e.pointerId);
  const dur=performance.now()-h.t0;
  if(!h.moved&&dur<220){
    /* 탭 = 스트라이크 */
    h.sus.kill();
    fieldTouch(h.x,h.y,e.pressure||h.c.vel);
  } else {
    /* 홀드·문지르기 = 잔향으로 놓아주기 */
    h.sus.release();
  }
}
$('sessionScreen').addEventListener('pointerup',endTouch);
$('sessionScreen').addEventListener('pointercancel',endTouch);
/* 기울기 → 공간 (권한 실패는 조용히 무시) */
function tiltHook(){
  const h=e=>{
    if(e.gamma==null||!wet)return;
    const g=Math.min(1,Math.abs(e.gamma)/45);
    wet.gain.setTargetAtTime(0.35+g*0.43,ctx().currentTime,0.2);
  };
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      DeviceOrientationEvent.requestPermission().then(p=>{if(p==='granted')addEventListener('deviceorientation',h);}).catch(()=>{});
    } else addEventListener('deviceorientation',h);
  }catch(e){}
}

/* ================= 호흡 오브 ================= */
let breathT0=0,breathRAF=null;
function breathLoop(){
  const pat=THEMES[S.theme].breath;
  const cyc=pat.reduce((a,p)=>a+p[1],0);
  const el=((performance.now()/1000-breathT0)%cyc+cyc)%cyc;
  let x=el,seg=pat[0];
  for(let i=0;i<pat.length;i++){if(x<pat[i][1]){seg=pat[i];break;}x-=pat[i][1];}
  const frac=x/seg[1];
  const inhale=seg[0]==='in';
  const scale=inhale?1+frac*0.45:1.45-frac*0.45;
  $('orb').style.transform=`scale(${scale.toFixed(3)})`;
  /* 음악이 호흡을 따라 숨쉰다 — 들숨에 차오르고 날숨에 놓아준다 */
  if(breathG){
    const lvl=inhale?0.94+frac*0.14:1.08-frac*0.14;
    breathG.gain.setTargetAtTime(lvl,ctx().currentTime,0.45);
  }
  /* 호흡 파동 — 들숨: 바깥의 파문이 오브로 모여든다 / 날숨: 오브에서 퍼져나간다 */
  const rings=document.querySelectorAll('#breathRings .br');
  const R_OUT=148,R_IN=82;
  rings.forEach((r,i)=>{
    const p=(frac+i/rings.length)%1;
    const rad=inhale?R_OUT-p*(R_OUT-R_IN):R_IN+p*(R_OUT-R_IN);
    const op=Math.sin(p*Math.PI)*0.4;
    r.setAttribute('r',rad.toFixed(1));
    r.setAttribute('opacity',op.toFixed(3));
  });
  breathRAF=S.running?requestAnimationFrame(breathLoop):null;
}

/* ================= 화면 잠금 · 백그라운드 복귀 =================
   20분에서 60분짜리 세션이므로 화면이 꺼지면 rAF가 멈추고 iOS는 오디오가 interrupted로 간다.
   Wake Lock은 백그라운드 진입 시 해제되므로 복귀할 때마다 다시 요청해야 한다. */
let wakeLock=null;
function wakeAcquire(){
  try{
    if(!('wakeLock' in navigator))return;
    navigator.wakeLock.request('screen').then(w=>{
      wakeLock=w;
      w.addEventListener('release',()=>{wakeLock=null;});
    }).catch(()=>{});
  }catch(e){}
}
function wakeRelease(){
  try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(AC&&AC.state==='suspended')AC.resume();
  if(!S.running)return;
  wakeAcquire();
  startRipples();
  if(!breathRAF)breathLoop();
  if(M.on&&!waveRAF)waveRAF=requestAnimationFrame(drawWave);
  if(!orbRAF)orbRAF=requestAnimationFrame(orbHueLoop);
});

/* ================= 세션 진행 ================= */
let remainIv=null;
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function startSession(){
  const ac=ctx();if(ac.state==='suspended')ac.resume();
  const th=THEMES[S.theme];
  const root=th.root;
  go('session');
  const ow=$('orbWrap');
  ow.classList.remove('in');
  void ow.offsetWidth;
  requestAnimationFrame(()=>requestAnimationFrame(()=>ow.classList.add('in')));
  S.running=true;
  if(!orbRAF)orbRAF=requestAnimationFrame(orbHueLoop);
  S.tStart=ac.currentTime;
  S.tEnd=S.tStart+S.mins*60;
  tingsha3(ac.currentTime+0.2);
  droneAmp=startDrone(root,th.pulse);
  /* 전문 라벨 — 튜닝 · 뇌파 대역 */
  $('remain').textContent=fmt(S.mins*60);
  $('quad').classList.remove('dim');
  setTimeout(()=>{$('quad').classList.add('dim');},12000);
  breathT0=performance.now()/1000+7; /* 오프닝 띵샤 뒤 들숨 0에서 시작 */
  breathLoop();
  startRipples();
  wakeAcquire();
  if(S.moktak)moktakStart(7); /* 호흡과 같은 자리에서 첫 박 */
  tiltHook();
  S.miniPhase=-1;
  remainIv=setInterval(()=>{
    const ac2=ctx();
    const rem=S.tEnd-ac2.currentTime;
    const el=ac2.currentTime-S.tStart;
    const total=S.mins*60;
    $('remain').textContent=fmt(rem);
    /* 프로그램 아크 축소판 — 단계 전환마다 드론 레벨 램프 + 띵샤 1타 */
    let ph=0;
    MINI_ARC.forEach((p,i)=>{if(el/total>=p.frac)ph=i;});
    if(ph!==S.miniPhase){
      S.miniPhase=ph;
      const p=MINI_ARC[ph];
      if(droneAmp){
        const t=ac2.currentTime;
        droneAmp.gain.cancelScheduledValues(t);
        droneAmp.gain.setValueAtTime(Math.max(droneAmp.gain.value,0.0001),t);
        droneAmp.gain.linearRampToValueAtTime(0.16*p.drone,t+8);
      }
      if(ph>0)tingsha(ac2.currentTime+0.1,88,0.4);
    }
    if(rem<=26&&!S.closing){S.closing=true;stopDrone(20);moktakStop();}
    if(rem<=6&&!S.rang){S.rang=true;tingsha3(ac2.currentTime+0.1);}
    if(rem<=0)finishSession();
  },500);
}
function finishSession(){
  if(!S.running)return;
  S.running=false;S.closing=false;S.rang=false;
  clearInterval(remainIv);remainIv=null;
  moktakStop();wakeRelease();
  if(breathRAF){cancelAnimationFrame(breathRAF);breathRAF=null;}
  if(orbRAF){cancelAnimationFrame(orbRAF);orbRAF=null;}
  touches.forEach(h=>h.sus.release());touches.clear();
  if(M.on){musicStop();$('mMaster').classList.remove('on');$('mstems').classList.remove('show');}
  stopDrone(3);
  go('checkout');
}
$('endBtn').onclick=()=>{tingsha3(ctx().currentTime+0.1);setTimeout(finishSession,600);};
$('mMaster').onclick=()=>{
  if(M.on){musicStop();$('mMaster').classList.remove('on');$('mstems').classList.remove('show');}
  else{musicStart();$('mMaster').classList.add('on');$('mstems').classList.add('show');}
};
$('mstems').querySelectorAll('.mt[data-m]').forEach(b=>{
  b.onclick=()=>{
    const on=!b.classList.contains('on');
    b.classList.toggle('on',on);
    setStem(b.dataset.m,on);
  };
});
$('mNext').onclick=musicNext;

/* ================= 체크인/아웃 ================= */
/* 수면 파문 애니메이터 — 위에서 내려다본 물
   파도: 일그러진 원들이 어긋나며 요동 / 잔물결: 중심에서 태어나 번지는 원 / 수면: 거의 완전한 원의 숨 */
const POND_SPEC={
  rough:{rings:3,wob:0.13,spd:2.2,jit:2.6,expand:false},
  ripple:{rings:3,wob:0.028,spd:1,jit:0,expand:true,period:3.4},
  still:{rings:1,wob:0.008,spd:0.4,jit:0,expand:false}
};
const REDUCED_W=REDUCED;
function pondPath(R,wob,t,ph,cx,cy){
  let d='';
  const N=40;
  for(let i=0;i<=N;i++){
    const th=i/N*Math.PI*2;
    const rr=R*(1+wob*Math.sin(th*3+ph+t)+wob*0.6*Math.sin(th*5-t*1.3+ph));
    const x=(cx+Math.cos(th)*rr).toFixed(2), y=(cy+Math.sin(th)*rr).toFixed(2);
    d+=(i===0?'M':'L')+x+','+y+' ';
  }
  return d+'Z';
}
function animPond(){
  const t=performance.now()/1000;
  document.querySelectorAll('.wave').forEach(w=>{
    const spec=POND_SPEC[w.dataset.w];
    const g=w.querySelector('.rippond');
    if(!g)return;
    if(!g.__init){
      g.__init=true;
      g.innerHTML='';
      for(let i=0;i<spec.rings;i++){
        const p=document.createElementNS('http://www.w3.org/2000/svg','path');
        g.appendChild(p);
      }
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('r','2.4');c.setAttribute('cx','50');c.setAttribute('cy','50');
      g.appendChild(c);
    }
    const paths=g.querySelectorAll('path');
    paths.forEach((p,i)=>{
      let R,op,swd,cx=50,cy=50;
      if(spec.expand){
        /* 번지는 파문 — 태어나서 자라고 사라진다 */
        const cyc=((t/spec.period)+i/spec.rings)%1;
        R=8+cyc*36;
        op=Math.sin(cyc*Math.PI)*0.85;
        swd=2-cyc*1.2;
      } else {
        R=[15,27,39][i]||15;
        if(spec.jit){cx=50+Math.sin(t*spec.spd*1.7+i*2.1)*spec.jit;cy=50+Math.cos(t*spec.spd*1.3+i*1.4)*spec.jit;}
        op=[0.9,0.62,0.4][i]||0.9;
        swd=[2,1.6,1.2][i]||2;
        if(spec.rings===1){R=30+Math.sin(t*spec.spd)*0.8;op=0.85;swd=1.8;}
      }
      p.setAttribute('d',pondPath(R,spec.wob,t*spec.spd,i*1.7,cx,cy));
      p.setAttribute('opacity',op.toFixed(2));
      p.setAttribute('stroke-width',swd.toFixed(2));
    });
  });
}
/* 수면 파문은 체크인·체크아웃 화면에서만 그린다. 세션 내내 돌면 프레임마다 40포인트 경로 6개를 헛되이 재생성한다 */
function pondTick(){
  if(S.screen==='checkin'||S.screen==='checkout')animPond();
  if(!REDUCED_W)requestAnimationFrame(pondTick);
}
pondTick();
const WAVE_EN={rough:'waves',ripple:'ripples',still:'still water'};
/* 세션 기록 — 이 기기 안에만 남는다 */
const LOGKEY='sumwave.sessions';
function readLog(){try{const a=JSON.parse(localStorage.getItem(LOGKEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function writeLog(entry){
  try{
    const a=readLog();a.push(entry);
    localStorage.setItem(LOGKEY,JSON.stringify(a.slice(-300)));
    return a;
  }catch(e){return readLog();}
}
const RANK={rough:0,ripple:1,still:2};
function wireWaves(wrapId,cb){
  $(wrapId).querySelectorAll('.wave').forEach(b=>{
    b.onclick=()=>{
      $(wrapId).querySelectorAll('.wave').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      cb(b.dataset.w);
    };
  });
}
wireWaves('wavesIn',c=>{S.colorIn=c;setTimeout(()=>go('choose'),650);});
wireWaves('wavesOut',c=>{
  S.colorOut=c;
  const all=writeLog({d:Date.now(),theme:S.theme,mins:S.mins,
    inW:S.colorIn,outW:c,tuning:S.tuning,bin:S.binaural,mok:S.moktak});
  const settled=all.filter(e=>RANK[e.outW]>RANK[e.inW]).length;
  const total=all.length;
  const hrs=all.reduce((a,e)=>a+(e.mins||0),0)/60;
  $('logline').textContent=total<2
    ? 'Your first record is kept'
    : 'Session '+total+' of yours, '+settled+' ended calmer, '+hrs.toFixed(1)+' hours in all';
  let msg;
  if(RANK[c]>RANK[S.colorIn])msg=`From ${WAVE_EN[S.colorIn]} to ${WAVE_EN[c]} — the water settled.<br>Not the sound, but your own<br>nervous system did this.`;
  else if(c===S.colorIn)msg=`Still ${WAVE_EN[c]}, and that is alright.<br>Watching the water — that was the meditation.`;
  else msg=`Honest water is good water.<br>Noticing is where stillness begins.`;
  $('delta').innerHTML=msg;
});

/* ================= 선택 화면 ================= */
$('themes').querySelectorAll('.theme').forEach(b=>{
  b.onclick=()=>{
    $('themes').querySelectorAll('.theme').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');S.theme=b.dataset.t;
    $('openBtn').style.transitionDelay='0.15s';
    $('openBtn').classList.add('show');
  };
});
$('lens').querySelectorAll('.len').forEach(b=>{
  b.onclick=()=>{
    $('lens').querySelectorAll('.len').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');S.mins=+b.dataset.m;
  };
});
/* 힌트는 켜진 항목 전체로 다시 그린다. 하나를 끌 때 다른 안내까지 지워지지 않게 */
function proHint(){
  const p=[];
  if(S.tuning===432)p.push('A=432, a touch lower and rounder');
  if(S.binaural)p.push('Binaural, with headphones a deeper layer forms beneath the breath');
  if(S.moktak)p.push('Moktak keeps a wooden pulse on your breath, and the upper left of the field becomes the moktak');
  $('proHint').innerHTML=p.join('<br>');
}
$('pro').querySelectorAll('.len').forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.p==='tuning'){
      S.tuning=S.tuning===440?432:440;
      b.classList.toggle('sel',S.tuning===432);
      b.textContent=S.tuning===432?'A=432 ✓':'A=432';
    } else if(b.dataset.p==='binaural'){
      S.binaural=!S.binaural;
      b.classList.toggle('sel',S.binaural);
    } else if(b.dataset.p==='moktak'){
      S.moktak=!S.moktak;
      b.classList.toggle('sel',S.moktak);
      if(S.running){S.moktak?moktakStart(0.3):moktakStop();}
      if(S.moktak)moktak(ctx().currentTime+0.02,72+THEMES[S.theme].root,0.6,0.3);
    }
    proHint();
  };
});
/* 지그시 눌러 입장 — 링이 차오르면 열린다 */
const ENTER_MS=1100, RING_LEN=590.6;
let enterRAF=null,enterT0=0;
function enterProgress(){
  const p=Math.min(1,(performance.now()-enterT0)/ENTER_MS);
  $('enterRing').style.strokeDashoffset=String(RING_LEN*(1-p));
  $('enterRingGlow').style.strokeDashoffset=String(RING_LEN*(1-p));
  if(p>=1){
    cancelAnimationFrame(enterRAF);enterRAF=null;
    ctx();
    tingsha(ctx().currentTime+0.02,88,0.35);
    go('checkin');
    setTimeout(()=>{$('enterRing').style.strokeDashoffset=String(RING_LEN);$('enterRingGlow').style.strokeDashoffset=String(RING_LEN);},1400);
    return;
  }
  enterRAF=requestAnimationFrame(enterProgress);
}
function enterDown(){
  if(S.screen!=='welcome'||enterRAF)return;
  ctx();
  enterT0=performance.now();
  enterRAF=requestAnimationFrame(enterProgress);
}
function enterUp(){
  if(!enterRAF)return;
  cancelAnimationFrame(enterRAF);enterRAF=null;
  $('enterRing').style.strokeDashoffset=String(RING_LEN);
  $('enterRingGlow').style.strokeDashoffset=String(RING_LEN);
  $('enterHint').classList.add('wake');
  $('enterHint').textContent='A little longer —';
  setTimeout(()=>{$('enterHint').classList.remove('wake');$('enterHint').textContent='Press it slowly..';},1600);
}
/* 첫 화면도 떠오르며 시작 */
(()=>{const els=document.querySelectorAll('#welcomeScreen .rv');
  els.forEach((el,i)=>{el.style.transitionDelay=(0.4+i*0.16).toFixed(2)+'s';requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('rvin')));});})();
$('enterWrap').addEventListener('pointerdown',enterDown);
$('enterWrap').addEventListener('pointerup',enterUp);
$('enterWrap').addEventListener('pointercancel',enterUp);
$('enterWrap').addEventListener('pointerleave',enterUp);
$('enterWrap').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();enterDown();}});
$('enterWrap').addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enterUp();}});
$('openBtn').onclick=startSession;
$('againBtn').onclick=()=>{
  S.colorIn=null;S.colorOut=null;
  document.querySelectorAll('.wave').forEach(x=>x.classList.remove('sel'));
  $('delta').textContent='';$('logline').textContent='';
  go('welcome');
};
</script>
